<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tatva CRM · Files</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1f1e1b;--ink2:#5d5b55;--ink3:#8d8a82;--line:#e4e1da;--line2:#d3cfc6;
  --accent:#8a5a2b;--accent-bg:#f6ece1;--sold:#2f6f5e;--sold-bg:#e3f1ec;--hold:#9a6412;--hold-bg:#fbf0dc;
  --lapsed:#8a3b33;--lapsed-bg:#f8e6e3;--dev:#6b6a66;--dev-bg:#ecebe7;--none-bg:#f1f0ec;--diff:#6a4bb0;--diff-bg:#efeafb;
  --radius:10px;--font:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);font-size:14px;color:var(--ink);background:var(--bg);line-height:1.45}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:14px}.brand span{font-size:12px;color:var(--ink3)}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink2);cursor:pointer}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.nav .ct{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding:20px 28px 60px;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;max-width:480px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line2);border-radius:9px;background:var(--panel)}
.search .ico{position:absolute;left:12px;top:11px;color:var(--ink3)}
.results{position:absolute;top:42px;left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:5;max-height:380px;overflow:auto}
.results a{display:flex;gap:10px;padding:9px 12px;text-decoration:none;cursor:pointer;border-bottom:1px solid var(--line)}
.results a:hover{background:var(--bg)}
.results small{color:var(--ink3);margin-left:auto}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-left:auto}
.role select{padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-weight:600}
.proto{font-size:12px;color:var(--ink3);width:100%}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-left:auto}
.who b{color:var(--ink)}.who .btn{padding:5px 10px;font-size:12.5px}
#login[hidden]{display:none}
#login{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);padding:16px;z-index:70}
#login form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 26px 22px;width:min(380px,100%);display:grid;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
#login h1{margin:0 0 2px;font-size:20px}#login p{margin:0 0 6px;color:var(--ink3);font-size:13px}
#login label{display:grid;gap:5px;font-size:12px;color:var(--ink3)}
#login input{font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line2);border-radius:8px}
#login .err{color:var(--lapsed);font-size:12.5px;min-height:16px}
.banner{background:var(--accent-bg);border:1px solid var(--accent);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.banner .btn{margin-left:auto}
.boot{display:grid;place-items:center;height:100vh;color:var(--ink3);font-size:14px}
.crumbs{font-size:13px;color:var(--ink3);margin-bottom:6px}
.crumbs a{cursor:pointer;text-decoration:none;color:var(--ink2)}.crumbs a:hover{text-decoration:underline}
h1{font-size:22px;margin:0 0 4px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink2);margin:0 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:4px 11px;font-size:13px;background:var(--panel);cursor:pointer;user-select:none}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on .muted{color:#cfccc4}
.chip.diff{border-color:#d5caef;color:var(--diff)}.chip.diff.on{background:var(--diff);color:#fff;border-color:var(--diff)}
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-sold{background:var(--sold-bg);color:var(--sold)}.b-hold{background:var(--hold-bg);color:var(--hold)}
.b-lapsed{background:var(--lapsed-bg);color:var(--lapsed)}.b-dev{background:var(--dev-bg);color:var(--dev)}.b-none{background:var(--none-bg);color:var(--ink3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h2 .src{white-space:nowrap;margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink3)}
.filters{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.filters label{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.filters input,.filters select{padding:5px 8px;border:1px solid var(--line2);border-radius:7px;background:var(--panel);font-size:13px}
.flabel{font-size:11.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;min-width:78px}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-weight:550}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px 22px}
.grid2.g3{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 18px}
.pcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}.pcols>div{min-width:0}
@media(max-width:1250px){.pcols{grid-template-columns:1fr}}
.tgl{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:0;font:inherit;font-weight:550;color:var(--ink);cursor:pointer}
.tgl i{position:relative;width:30px;height:17px;border-radius:9px;background:var(--line2);transition:background .15s;flex:none}
.tgl i:after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on i{background:var(--sold)}.tgl.on i:after{left:15px}
.tgl:disabled{cursor:not-allowed;color:var(--ink3)}.tgl:disabled i{opacity:.5}
.dpw{position:relative;display:inline-block;outline:none}
.dpw .dpn{font-weight:400;font-size:12px;color:var(--accent);border-bottom:1px dashed var(--accent);cursor:default;margin-left:4px}
.dpop{display:none;position:absolute;z-index:30;top:calc(100% + 4px);left:0;min-width:300px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:10px 12px;font-weight:400;font-size:12.5px}
.dpw:hover .dpop,.dpw:focus-within .dpop{display:block}
.dpop table{font-size:12.5px}.dpop td{padding:3px 8px 3px 0;white-space:nowrap}.dpop td.r{text-align:right;padding-right:0}
.dpop tfoot td{border-top:1px solid var(--line);font-weight:600;padding-top:5px}
.dpop .x{text-decoration:line-through;color:var(--ink3)}
.kv small{display:block;font-size:11.5px;color:var(--ink3)}.kv div{font-weight:550}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--ink3);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.sr,th.sr{color:var(--ink3);width:46px;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#faf9f6}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:650;border-bottom:none}
.muted{color:var(--ink3)}
.ed{display:inline-flex;align-items:center;gap:4px}
.pen{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:none;background:none;color:var(--ink3);cursor:pointer;opacity:.45;padding:0;flex:none}
.pen svg{width:13px;height:13px}
tr:hover .pen,.card h2 .pen,.psub .pen,.pen:focus{opacity:.85}
td.pcell,th.pcell{width:30px;padding-left:0!important;padding-right:6px!important;text-align:right}
.psub{display:flex;align-items:center;gap:6px}
.dlg .lk{font-size:11.5px;color:var(--lapsed)}
.pen:hover{opacity:1;background:var(--accent-bg);color:var(--accent)}

.dbg{position:fixed;inset:0;background:rgba(30,24,18,.38);z-index:60;display:grid;place-items:center;padding:16px}
.dlg{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:min(420px,100%);max-height:calc(100vh - 32px);overflow:auto}
.dlg.wide{width:min(680px,100%)}
.dlg .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dlg .dh h3{margin:0;font-size:16px}.dlg .dh small{display:block;color:var(--ink3);font-size:12px;margin-top:3px}
.dlg .dx{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--ink3)}
.dlg .db{padding:14px 18px;display:grid;gap:12px}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:1px solid var(--line)}
.dlg label{font-size:12px;color:var(--ink3);display:grid;gap:5px}
.dlg input,.dlg select,.dlg textarea{font:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;background:#fff;color:var(--ink)}
.dlg input:focus,.dlg select:focus,.dlg textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
.dlg .was{font-size:12px;color:var(--ink3)}
.dlg .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);font-weight:650;margin-top:4px}
.dlg .chips{display:flex;flex-wrap:wrap;gap:6px}
.dlg .chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.dlg .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dlg .warn{background:var(--hold-bg);color:var(--hold);border-radius:8px;padding:8px 10px;font-size:12.5px}
.dlg .warn a{color:inherit;font-weight:650;cursor:pointer;text-decoration:underline}
@media(max-width:560px){.dlg .g2{grid-template-columns:1fr}}
.ed.edited{box-shadow:inset 0 -2px 0 #e9c46a}
.ed input,.ed select{font-size:13px;padding:3px 6px;border:1.5px solid var(--accent);border-radius:6px;min-width:110px;max-width:100%;background:#fff}
.lock{font-size:11px;margin-left:4px;color:var(--lapsed)}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.folder{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-decoration:none}
.folder:hover{border-color:var(--accent)}
.folder .ico{width:22px;height:22px;color:var(--accent);margin-top:1px}
.folder b{display:block;font-size:13.5px}.folder span{font-size:12px;color:var(--ink3)}
.drop{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:16px;text-align:center;color:var(--ink3);background:#fbfaf8}
.drop.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.drop button{margin-top:8px;padding:6px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);cursor:pointer}
.files{margin-top:12px;display:grid;gap:8px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.file .ext{font-size:10.5px;font-weight:700;width:38px;text-align:center;padding:4px 0;border-radius:6px;background:var(--accent-bg);color:var(--accent);text-transform:uppercase}
.file a{margin-left:auto;font-size:12.5px;cursor:pointer;color:var(--accent)}
.err{color:var(--lapsed);font-size:12.5px;margin-top:8px}
.plotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:5px}
.pt{border-radius:6px;padding:6px 0;text-align:center;font-size:12px;font-weight:600;cursor:pointer;border:1px solid transparent;font-variant-numeric:tabular-nums}
.pt:hover{outline:2px solid var(--ink)}
.pt.s-sold{background:var(--sold);color:#fff}.pt.s-hold{background:#e3a23b;color:#3b2604}
.pt.s-unsold{background:var(--panel);border-color:var(--line2);color:var(--ink2)}
.pt.s-dev{background:repeating-linear-gradient(45deg,#e9e7e2,#e9e7e2 4px,#f4f3ef 4px,#f4f3ef 8px);color:var(--ink3)}
.pt.s-pre{background:#9fb8ae;color:#fff}.pt.s-none{background:var(--none-bg);color:var(--ink3)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 10px}
.ltag{cursor:pointer;padding:3px 8px;border-radius:999px;border:1px solid transparent;user-select:none}.ltag:hover{border-color:var(--line2)}.ltag.on{border-color:var(--ink);font-weight:600}.ltag.dim{opacity:.35}
.pt.faded{opacity:.15}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat small{color:var(--ink3);font-size:12px}.stat div{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.tmeta .exp{float:right;color:var(--ink3)}.tmeta .exp a{cursor:pointer;color:var(--accent);font-weight:600}
.danger{color:var(--lapsed)!important;border-color:#e7c9c4!important}
.dlg .df .left{margin-right:auto}
.clip{display:inline-block;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.rmk{display:flex;flex-direction:column;gap:3px;max-width:400px;font-size:12.5px;line-height:1.35}
.rmk>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink3)}
.rmk>div.last{color:var(--ink)}
.rmk.full{max-width:none}.rmk.full>div{white-space:normal}
.rmk .nt{font-style:italic}
.fu{display:inline-block;min-width:30px;text-align:center;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:9px;margin-right:2px;background:var(--accent-bg);color:var(--accent);vertical-align:1px}
.fu.f3{background:var(--diff-bg);color:var(--diff)}.fu.f4{background:var(--ink);color:var(--panel)}
.fu-d{color:var(--ink3);margin-right:2px;white-space:nowrap}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--hold-bg);border-radius:8px;padding:8px 10px;margin:0 0 12px;font-size:13px}.acts span{flex:1;min-width:160px;color:var(--hold)}
.note{font-size:12.5px;color:var(--ink2);background:var(--accent-bg);border-radius:8px;padding:9px 12px;margin-bottom:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;font-size:13px;cursor:pointer}
.bar .track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar.on{font-weight:650}.bar.on .fill{background:var(--ink)}
.addform{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end}
.addform label{font-size:12px;color:var(--ink3);display:grid;gap:4px}
.addform input,.addform select{padding:6px 8px;border:1px solid var(--line2);border-radius:7px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.preview{position:fixed;inset:0;background:rgba(20,18,15,.55);display:grid;place-items:center;z-index:20}
.preview .box{background:var(--panel);border-radius:12px;width:min(900px,92vw);height:min(82vh,900px);display:flex;flex-direction:column;overflow:hidden}
.preview .bar2{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.preview .bar2 button{margin-left:auto;border:none;background:none;font-size:20px;cursor:pointer}
.preview iframe,.preview img{flex:1;width:100%;border:0;object-fit:contain;background:#f0efeb;min-height:0}
.th{display:inline-flex;align-items:center;gap:4px}
.fbtn{border:none;background:none;padding:2px 3px;border-radius:4px;cursor:pointer;color:var(--ink3);display:inline-grid;place-items:center;line-height:0}
.fbtn:hover{background:var(--bg);color:var(--ink)}.fbtn.on{background:var(--accent);color:#fff}
.psub{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);margin:14px 0 8px;padding-top:10px;border-top:1px solid var(--line)}.psub:first-of-type{border-top:none;padding-top:0;margin-top:0}
.tmeta{font-size:13px;color:var(--ink3);margin:0 0 6px}.tmeta a{color:var(--accent);cursor:pointer}
.tablecard{padding:4px 6px}.tscroll{overflow-x:auto}
.pop{position:absolute;z-index:40;width:290px;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:8px 0;font-size:13px}
.pop .ptitle{padding:4px 12px 6px;font-weight:650}
.pop .pitem{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 12px;cursor:pointer}.pop .pitem:hover{background:var(--bg)}
.pop .psec{padding:8px 12px 6px;border-top:1px solid var(--line);margin-top:4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.pop input[type=search],.pop input[type=number]{padding:6px 8px;border:1px solid var(--line2);border-radius:7px;font-size:13px}
.pop a{color:var(--accent);cursor:pointer}
.plist{max-height:240px;overflow:auto;padding:2px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.plist label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer}.plist label span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.pfoot{justify-content:flex-end;padding:8px 12px 2px;gap:8px}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}.split{grid-template-columns:1fr}main{padding:14px}}
</style>
</head>
<body>
<div id="bootMsg" class="boot">Loading…</div>
<div id="login" hidden></div>
<div class="app" id="app" hidden>
  <aside>
    <div class="brand"><div class="brand-mark">T</div><div><b>Tatva CRM</b><span>Files</span></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" placeholder="Search client name, phone or plot number" autocomplete="off">
        <div class="results" id="results" hidden></div>
      </div>
      <div class="who" id="who"></div>
      <div class="proto">Click the pencil to edit · use the filter button in column headers to sort and filter · every change is saved for the whole team</div>
    </div>
    <div id="banner"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div><div id="dlg"></div><div id="toastBox"></div><div id="popBox"></div>
<script>
function startApp(D, ME, LOG) {
{ const bm = document.getElementById('bootMsg'); if (bm) bm.remove(); document.getElementById('app').hidden = false; }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = v => v == null || v === '' ? '—' : '₹' + Number(v).toLocaleString('en-IN', {maximumFractionDigits: 0});
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const isISO = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');
const fd = v => { if (!v) return '—'; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v); return m ? `<span style="white-space:nowrap">${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}</span>` : esc(v); };
const val = v => (v == null || v === '') ? '<span class="muted">—</span>' : esc(v);
const ICON = {
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.4"/><path d="M16.5 14.2c2.2.2 3.6 1.8 4 4.3"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  land:'<path d="M3 18l5-8 4 5 3-4 6 7z"/><circle cx="16" cy="6" r="2"/>',
  hand:'<path d="M8 12l3 3 5-6"/><circle cx="12" cy="12" r="8.5"/>',
  tool:'<path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.6 2.6-2.4-.6-.6-2.4z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  coins:'<ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v5c0 1.7 3.1 3 7 3s7-1.3 7-3V7M5 12v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"/>',
  award:'<circle cx="12" cy="9" r="5.5"/><path d="M8.5 13.5L7 21l5-2.5 5 2.5-1.5-7.5"/>',
  pin:'<path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10" r="2.3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>'
};
const ico = n => `<svg class="ico" viewBox="0 0 24 24">${ICON[n]}</svg>`;
function toast(msg) { $('#toastBox').innerHTML = `<div class="toast">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $('#toastBox').innerHTML = '', 2600); }

// ---------- changes come from (and go to) the server ----------
const mapEdit = e => ({eid: e.id, coll: e.coll, id: e.rec_id, field: e.field, old: e.old, new: e.new, label: e.label, undone: e.undone, undoOf: e.undo_of, role: e.role, user: e.user_name, at: e.at});
const mapStep = s => ({...s.data, type: s.type, at: s.at, role: s.role, user: s.user_name});
let store = {edits: LOG.edits.map(mapEdit), flows: LOG.steps.map(mapStep), added: {visits: [], expenses: []}, role: ME.role};
let myVersion = LOG.version;
const saveStore = () => {};
async function sendOps(ops) {
  const r = await api('/api/ops', {body: {ops}});
  myVersion = Math.max(myVersion, r.version);
  Object.entries(r.sr || {}).forEach(([k, sr]) => { const [coll, id] = k.split('|'); const o = IDX[coll] && IDX[coll][id]; if (o) o.sr = sr; });
  (r.edits || []).forEach(e => store.edits.push(mapEdit(e)));
  return r;
}
// Records a step (hold, booking, ...) that changes several records at once: we change them here, then send every changed record.
const TRACK = ['visits', 'clients', 'bookings', 'payments', 'expenses'];
function snap() {
  const s = {}; TRACK.forEach(k => { s[k] = {}; D[k].forEach(o => s[k][o.id] = JSON.stringify(o)); });
  s.plots = {}; Object.values(D.plots).forEach(p => s.plots[p.id] = JSON.stringify(p)); s.plotOwners = {...D.plotOwners}; return s;
}
function diffOps(s) {
  const ops = [];
  TRACK.forEach(k => D[k].forEach(o => { const j = JSON.stringify(o); if (s[k][o.id] !== j) ops.push({op: 'put', coll: k, id: o.id, data: o, newSr: !(o.id in s[k])}); }));
  Object.values(D.plots).forEach(p => { if (s.plots[p.id] !== JSON.stringify(p)) ops.push({op: 'put', coll: 'plots', id: p.id, data: p}); });
  Object.entries(D.plotOwners).forEach(([k, v]) => { if (s.plotOwners[k] !== v) ops.push({op: 'put', coll: 'plotOwners', id: k, data: v}); });
  return ops;
}
let saving = false;
async function commit(s, steps, okMsg, go) {
  const ops = diffOps(s).concat(steps.map(f => ({op: 'step', type: f.type, data: f})));
  reindex(); if (go && location.hash !== go) location.hash = go; else render();
  saving = true;
  try { await sendOps(ops); steps.forEach(f => store.flows.push({...f, user: ME.name, role: ME.role, at: new Date().toISOString()})); toast(okMsg); render(); }
  catch (e) { toast(e.message + ' Reloading…'); setTimeout(() => location.reload(), 2500); }
  finally { saving = false; }
}
async function checkVersion() {
  if (saving || document.hidden) return;
  try { const r = await api('/api/version'); if (r.version > myVersion && !$('#banner').innerHTML) $('#banner').innerHTML = `<div class="banner">Someone else has made changes. Refresh to see the latest data.<button class="btn primary small" onclick="location.reload()">Refresh</button></div>`; } catch (e) {}
}
function renderWho() {
  $('#who').innerHTML = `<span><b>${esc(ME.name)}</b> · ${esc(ME.role)}</span><button class="btn" data-mypass>Change password</button><button class="btn" data-logout>Sign out</button>`;
}

// ---------- normalise + index ----------
const AGENT_FIX = {'Sahil': 'Sahil Bhai', 'Vaibhav Bhai': 'Vaibhav', "Rashi Ma'Am": 'Rashi'};
const agentsOf = s => (s || '').split(/,|&|\//).map(x => x.trim()).filter(Boolean).map(x => AGENT_FIX[x] || x);
D.visits.sort((a, b) => (b.added ? 1 : 0) - (a.added ? 1 : 0) || (a.added ? (b.sr || 0) - (a.sr || 0) : 0));
D.contractors.forEach(c => { c.expenses = D.expenses.filter(e => (!e.added && (c.expenseRows || []).includes(e.row)) || e.contractor === c.name); });
const IDX = {};
const indexColl = (name, arr) => { const m = IDX[name] || (IDX[name] = {}); Object.keys(m).forEach(k => delete m[k]); arr.forEach(o => m[o.id] = o); };
var derivedReady = false;
function reindex() {
  indexColl('visits', D.visits); indexColl('bookings', D.bookings); indexColl('payments', D.payments); indexColl('clients', D.clients);
  indexColl('plots', Object.values(D.plots)); indexColl('expenses', D.expenses); indexColl('landowners', D.landowners);
  indexColl('advances', D.advances); indexColl('incentives', D.incentives); indexColl('registry', Object.values(D.registry));
  indexColl('dastavej', Object.values(D.dastavej)); indexColl('ledger', D.contractors.flatMap(c => c.ledger));
  if (derivedReady) rebuildDerived();
}
reindex();
const maxSr = arr => Math.max(0, ...arr.map(o => o.sr || 0));
// Plots: TRPL plots and plots sold before TRPL each have their own Sr. series (1, 2, 3 …), in Plot List order.
const isPrePlot = p => p.trpl === 'Before TRPL';
const plotSr = new Map();
[false, true].forEach(pre => Object.values(D.plots).filter(p => isPrePlot(p) === pre).sort((a, b) => (a.sr || 0) - (b.sr || 0)).forEach((p, i) => plotSr.set(p.no, i + 1)));
const plotSrLabel = p => (isPrePlot(p) ? 'Before TRPL Sr. ' : 'TRPL Sr. ') + (plotSr.get(p.no) || '—');

// ---------- hold → booking → payment steps (saved as a list of steps, replayed on load) ----------
const newPay = (f, text, amount, mode, plots, cid) => ({id: f.pid, sr: f.psr, row: 0, added: true, month: null, date: f.date, text, amount, mode, note: f.note || null, plots, status: 'Received', clients: [cid]});
function applyFlow(f) {
  const P = D.plots;
  if (f.type === 'hold') {
    let c = D.clients.find(x => x.id === f.cid);
    if (!c) { c = {id: f.cid, sr: f.csr, name: f.name, phone: f.phone, plots: [], bookings: [], links: [], docStatus: null, added: true}; D.clients.push(c); }
    const b = {id: f.bid, sr: f.bsr, row: 0, added: true, cid: c.id, client: c.name, phone: c.phone, by: f.by, visitDate: f.visitDate || null, holdDate: f.date, holdAmount: f.amount || null, holdMode: f.mode, plot: f.plot,
      outcome: 'Plot On Hold', finalAmount: null, refunded: null, refundDate: null, dpAmount: null, dpDate: null, dpMode: null, loan: null, loanAmount: null, emi: null, mou: null, dastavejStatus: null, payment: null, maintenanceCheque: null, remarks: f.note || null};
    D.bookings.push(b); c.bookings.push(b.id); if (!c.plots.includes(f.plot)) c.plots.push(f.plot);
    c.links.push({name: c.name, source: 'Added in CRM', plot: f.plot, how: f.vid ? 'hold taken from a site visit' : 'hold taken from the client folder'});
    if (P[f.plot]) P[f.plot].status = 'HOLD';
    if (f.vid) { const v = D.visits.find(x => x.id === f.vid); if (v) v.client = c.id; }
    D.visits.forEach(v => { if (v.client === c.id && v.reopened) v.reopened = false; });
    if (f.amount) D.payments.push(newPay(f, 'Hold amount · plot ' + f.plot, f.amount, f.mode, [f.plot], c.id));
  } else if (f.type === 'book') {
    const b = D.bookings.find(x => x.id === f.bid); if (!b) return;
    Object.assign(b, {outcome: 'Converted', finalAmount: f.final, bookingAmount: f.amount || null, bookingDate: f.date, bookingMode: f.mode, loan: f.loan, loanAmount: f.loanAmount || null, emi: f.emi || null});
    if (P[b.plot]) P[b.plot].status = 'SOLD OUT';
    D.plotOwners[b.plot] = f.cid;
    const c = D.clients.find(x => x.id === f.cid); if (c && !c.docStatus) c.docStatus = 'MOU not done';
    const v = D.visits.find(x => x.id === f.vid); if (v) v.status = 'Converted';
    if (f.amount) D.payments.push(newPay(f, 'Booking amount · plot ' + b.plot, f.amount, f.mode, [b.plot], f.cid));
  } else if (f.type === 'pay') {
    const np = newPay(f, f.text || 'Payment' + (f.plot ? ' · plot ' + f.plot : ''), f.amount, f.mode, f.plot ? [f.plot] : [], f.cid);
    if (f.dpOf) np.dpOf = f.dpOf; // a down payment (DP) instalment of this booking
    D.payments.push(np);
  } else if (f.type === 'lapse') {
    const b = D.bookings.find(x => x.id === f.bid); if (!b) return;
    Object.assign(b, {outcome: 'Lapsed', refunded: f.refund ? 'Refunded' : 'Not Refunded', refundDate: f.refund ? f.date : null});
    if (f.refund && b.refundAmount == null) Object.assign(b, {refundAmount: b.holdAmount || null, refundMode: b.holdMode || null});
    if (P[b.plot] && /HOLD/i.test(P[b.plot].status || '')) P[b.plot].status = 'UNSOLD';
  }
}
reindex();

function getF(coll, o, f) { return o[f]; }
function setF(coll, o, f, v) {
  o[f] = v;
  if (coll === 'visits' && f === 'status' && o.client) o.reopened = /follow/i.test(v || '');
  if (coll === 'visits' && /^fu\d(Date|Note)$/.test(f)) { const i = +f[2] - 1; o.followups = o.followups || [1, 2, 3, 4].map(s => ({step: s, who: s <= 2 ? 'Agent' : s === 3 ? 'Sahil Bhai' : 'Pratik Sir', date: null, note: null})); o.followups[i][f.endsWith('Date') ? 'date' : 'note'] = v; }
  if (coll === 'expenses') { D.contractors.forEach(c => c.expenses.forEach((x, k) => { if (x.row === o.row && !o.added) c.expenses[k] = o; })); }
}
const DOC_OPTS = ['MOU not done', 'MOU done', 'Dastavej pending at office', 'Dastavej done', 'Dastavej done & sent', 'Without dastavej'];
const editedSet = new Set();
store.edits.forEach(e => { if (!e.undone && !e.undoOf) editedSet.add(e.coll + '|' + e.id + '|' + e.field); });

// ---------- lookups ----------
const bookingById = IDX.bookings, clientById = IDX.clients;
const plotOwner = {}, plotBk = {}; // filled by rebuildDerived(): who owns each plot and which booking decides its status
const landByPlot = () => Object.fromEntries(D.landowners.filter(l => l.plot).map(l => [l.plot, l]));
// Status of a site visit. When the visit is linked to a client folder, the folder decides it (Converted / Hold / Lapsed),
// so the Site visits list and the Clients list always agree. Otherwise it is the status set on the visit itself.
// One exception: a lapsed client's visit can be put back on Follow up (v.reopened), so it returns to the Follow up tab.
// "Not interested" (the old sheet value NOT INTERESTED) is shown as Lapsed.
const VISIT_STATUSES = ['Follow up 1', 'Follow up 2', 'Follow up 3', 'Follow up 4', 'Hold', 'Converted', 'Lapsed', 'No status'];
const clientLapsed = c => !!c && clientStatus(c)[0] === 'Lapsed';
// Site visits: the Follow up tab and the Lapsed tab each have their own Sr. series (1, 2, 3 … oldest first),
// worked out from the current statuses, so a visit gets a new number when it moves to the other tab.
const isLapsedVisit = v => vStatus(v)[0] === 'Lapsed';
function visitSrs() {
  const m = new Map(), n = [0, 0];
  [...D.visits].sort((a, b) => (a.sr || 0) - (b.sr || 0)).forEach(v => { const k = isLapsedVisit(v) ? 1 : 0; m.set(v.id, ++n[k]); });
  return m;
}
const visitSrLabel = (v, m = visitSrs()) => (isLapsedVisit(v) ? 'Lapsed Sr. ' : 'Follow up Sr. ') + (m.get(v.id) || '—');
// The Remark holds the old follow-up notes as "FU1 21/07/26: note · FU2: note · …". remarkHtml() shows each follow-up
// on its own line (FU label, short date, note), with plain notes before and after, on the visit page. The Site visits
// list shows only the latest follow-up (full remark on hover). The saved text is not changed.
const FU_RE = /^FU([1-4])(?:\s+(\d\d)\/(\d\d)\/(\d\d))?\s*:\s*([\s\S]*)$/;
function remarkParts(r) {
  const out = {before: [], fus: [], after: []};
  String(r || '').split(' · ').map(x => x.trim()).filter(Boolean).forEach(x => { const m = FU_RE.exec(x);
    if (m) out.fus.push({n: +m[1], date: m[2] ? `${+m[2]} ${MONTHS[+m[3] - 1] || m[3]} ${m[4]}` : null, text: m[5]}); else (out.fus.length ? out.after : out.before).push(x); });
  return out;
}
function remarkHtml(r, full) {
  if (!r) return '<span class="muted">—</span>';
  const p = remarkParts(r); if (!p.fus.length) return full ? `<div class="rmk full"><div class="last">${esc(r)}</div></div>` : `<span class="muted clip">${esc(r)}</span>`;
  if (!full) { const f = p.fus[p.fus.length - 1]; // list: only the latest follow-up; the visit page shows them all
    return `<div class="rmk" title="${esc(r)}"><div class="last"><span class="fu f${f.n}">FU${f.n}</span> ${f.date ? `<span class="fu-d">${f.date}</span> ` : ''}${esc(f.text || '—')}</div></div>`; }
  const who = n => full && n >= 3 ? ` <span class="muted">(${n === 3 ? 'Sahil Bhai' : 'Pratik Sir'})</span>` : '';
  const lines = [...p.before.map(x => `<div>${esc(x)}</div>`),
    ...p.fus.map((f, i) => `<div${i === p.fus.length - 1 ? ' class="last"' : ''}><span class="fu f${f.n}">FU${f.n}</span> ${f.date ? `<span class="fu-d">${f.date}</span> ` : ''}${esc(f.text || '—')}${who(f.n)}</div>`),
    ...p.after.map(x => `<div class="nt">${esc(x)}</div>`)];
  return `<div class="rmk${full ? ' full' : ''}"${full ? '' : ` title="${esc(r)}"`}>${lines.join('')}</div>`;
}
const fuFromRemark = v => { const m = String(v.remark || '').match(/FU([1-4])/g); return m ? Math.max(...m.map(x => +x[2])) : 1; };
function vStatus(v) {
  const c = v.client && clientById[v.client];
  const s = (v.status || '').toUpperCase();
  if (c && !(clientLapsed(c) && v.reopened && s.includes('FOLLOW'))) { const cs = clientStatus(c)[0]; return cs === 'On hold' ? ['Hold', 'b-hold'] : cs === 'Lapsed' ? ['Lapsed', 'b-lapsed'] : ['Converted', 'b-sold']; }
  if (s.includes('NOT') || s.includes('LAPS')) return ['Lapsed', 'b-lapsed'];
  if (s === 'DONE' || s.includes('CONVERT')) return ['Converted', 'b-sold'];
  if (s.includes('HOLD')) return ['Hold', 'b-hold'];
  if (s.includes('FOLLOW')) { const n = (s.match(/[1-4]/) || [])[0] || fuFromRemark(v); return ['Follow up ' + n, 'b-dev']; }
  return ['No status', 'b-none'];
}
const isConvertedVisit = v => vStatus(v)[0] === 'Converted';
const isConvertedBooking = b => /convert/i.test(b.outcome || '');
function clientStatus(c) {
  const outs = c.bookings.map(id => (bookingById[id].outcome || '').toLowerCase());
  if (outs.some(o => o.startsWith('convert'))) return ['Booked', 'b-sold'];
  if (outs.some(o => o.includes('hold'))) return ['On hold', 'b-hold'];
  if (outs.length) return ['Lapsed', 'b-lapsed'];
  return ['Sold · registers only', 'b-none'];
}
// A plot's status and owner come from its bookings when it has one, so Plots, Clients and Sold plots always agree.
function rebuildDerived() {
  Object.keys(plotBk).forEach(k => delete plotBk[k]);
  D.bookings.forEach(b => { if (!b.plot) return; const e = plotBk[b.plot] || (plotBk[b.plot] = {}); if (isConvertedBooking(b)) e.conv = b; else if (/hold/i.test(b.outcome || '')) e.hold = b; });
  Object.keys(plotOwner).forEach(k => delete plotOwner[k]); Object.assign(plotOwner, D.plotOwners);
  D.clients.forEach(c => c.bookings.forEach(id => { const b = bookingById[id]; if (b && b.plot && isConvertedBooking(b)) plotOwner[b.plot] = c.id; }));
}
derivedReady = true; rebuildDerived();
const clientPayments = id => D.payments.filter(p => p.clients.includes(id));
const received = p => p.status !== 'Cheque returned';
const paidOf = list => list.filter(received).reduce((a, p) => a + (p.amount || 0), 0);
const clientPlots = c => { const own = c.plots.filter(p => D.plots[p] && plotOwner[p] === c.id);
  const held = c.bookings.map(id => bookingById[id]).filter(b => b && /hold/i.test(b.outcome || '') && D.plots[b.plot] && !own.includes(b.plot)).map(b => b.plot);
  const r = [...new Set([...own, ...held])]; return r.length ? r : c.plots.filter(p => D.plots[p]); };
const clientSize = c => { const a = clientPlots(c).map(p => D.plots[p].area).filter(x => x != null); return a.length ? Math.round(a.reduce((s, x) => s + x, 0) * 100) / 100 : null; };
const clientFinal = c => { const conv = c.bookings.map(id => bookingById[id]).filter(b => /convert/i.test(b.outcome || '') && b.finalAmount);
  if (conv.length) return conv.reduce((s, b) => s + b.finalAmount, 0);
  const deeds = clientPlots(c).map(p => D.dastavej[p]).filter(d => d && d.finalAmount); return deeds.length ? deeds.reduce((s, d) => s + d.finalAmount, 0) : null; };
const lastHoldBooking = c => c.bookings.map(id => bookingById[id]).filter(b => b.holdDate || b.holdAmount).sort((a, b) => String(a.holdDate || '').localeCompare(String(b.holdDate || ''))).pop() || null;
const clientDate = c => { const ds = c.bookings.map(id => bookingById[id]).flatMap(b => [b.holdDate, b.dpDate, b.bookingDate]).filter(d => d && /^\d{4}-\d\d-\d\d/.test(d)).sort(); return ds.length ? ds[ds.length - 1] : null; };
// Booking money. Refund only applies to a lapsed hold. Down payment (DP) can come in several instalments: each one is a
// payment linked to the booking (dpOf), plus the single DP typed on the booking itself (old sheet data / pencil).
const isRefunded = b => /^refunded/i.test(b.refunded || '');
const isLapsedBooking = b => !!b.outcome && !isConvertedBooking(b) && !/hold/i.test(b.outcome);
function dpEntries(b) {
  const own = b.dpAmount || b.dpDate ? [{date: b.dpDate, amount: b.dpAmount, mode: b.dpMode, typed: true}] : [];
  return own.concat(D.payments.filter(p => p.dpOf === b.id).map(p => ({date: p.date, amount: p.amount, mode: p.mode, note: p.note, returned: !received(p), pid: p.id}))
    .sort((x, y) => String(x.date || '').localeCompare(String(y.date || ''))));
}
const dpTotal = b => { const e = dpEntries(b).filter(x => !x.returned && x.amount); return e.length ? e.reduce((a, x) => a + x.amount, 0) : null; };
const amtCell = (p, html) => received(p) ? html : `<span style="text-decoration:line-through;color:var(--ink3)">${html}</span>`;
const payBadge = p => received(p) ? '<span class="badge b-sold">Received</span>' : '<span class="badge b-lapsed">Cheque returned</span>';
function plotClass(p) {
  const bk = plotBk[p.no];
  if (bk && bk.conv) return ['s-sold', 'Sold', 'b-sold'];
  if (bk && bk.hold) return ['s-hold', 'Hold', 'b-hold'];
  const s = (p.status || '').toUpperCase();
  if (s.includes('UNSOLD')) return ['s-unsold', 'Unsold', 'b-none'];
  if (s.includes('SOLD')) return ['s-sold', 'Sold', 'b-sold'];
  if (s.includes('HOLD')) return ['s-unsold', 'Unsold', 'b-none']; // marked Hold but nobody's hold is active
  if (s.includes('DEVELOP')) return ['s-dev', 'Development area', 'b-dev'];
  if (p.trpl === 'Before TRPL') return ['s-pre', 'Sold before TRPL', 'b-dev'];
  return ['s-none', 'Not marked', 'b-none'];
}
const fuStage = v => { for (let i = 4; i >= 1; i--) if (v['fu' + i + 'Date'] || v['fu' + i + 'Note']) return i; return 0; };
const AGENTS = [...new Set([...D.visits, ...D.bookings].flatMap(x => agentsOf(x.by)))].filter(a => a !== 'Company').sort();
const OPTS = {
  visitStatus: ['Follow up 1', 'Follow up 2', 'Follow up 3', 'Follow up 4', 'Converted', 'Lapsed'],
  agents: [...AGENTS, 'Company'],

// ---------- Export to Excel / CSV ----------
const canExport = () => ME.role !== 'Agent';
const isoDay = v => typeof v === 'string' && /^\d{4}-\d\d-\d\d/.test(v);
function cellValue(c, r) {
  let v = c.get(r);
  if (Array.isArray(v)) v = v.join(', ');
  if (v == null || v === '') return null;
  if ((c.type === 'num' || c.type === 'money') && typeof v === 'number' && isFinite(v)) return {n: v, money: c.type === 'money'};
  if (c.type === 'date' && isoDay(v)) return {d: v.slice(0, 10)};
  return String(v);
}
function tableSheet(T, name) {
  const cols = T.cols.filter(c => c.label && c.k !== 'act');
  return {name, head: cols.map(c => c.label), rows: (T.useAll ? T.rows : T.shown).map(r => cols.map(c => cellValue(c, r)))};

const DELETABLE = ['visits', 'clients', 'bookings', 'payments', 'expenses', 'landowners', 'advances', 'incentives', 'registry', 'dastavej', 'ledger'];
const canDelete = () => ME.role === 'Super admin';

  if (coll === 'clients') {
    for (const id of o.bookings) { const b = bookingById[id]; if (b && /hold/i.test(b.outcome || '')) freeHeldPlot(b); drop(D.bookings, id); }
    D.payments.filter(p => p.clients.includes(o.id)).forEach(p => { if (p.clients.length === 1) drop(D.payments, p.id); else p.clients = p.clients.filter(x => x !== o.id); });
    Object.keys(D.plotOwners).forEach(k => { if (D.plotOwners[k] === o.id) delete D.plotOwners[k]; });
    D.visits.forEach(v => { if (v.client === o.id) v.client = null; });
    drop(D.clients, o.id);
  } else if (coll === 'bookings') {
    if (/hold/i.test(o.outcome || '')) freeHeldPlot(o);
    D.clients.forEach(c => { if (c.bookings.includes(o.id)) c.bookings = c.bookings.filter(x => x !== o.id); });
    drop(D.bookings, o.id);
  } else if (coll === 'registry' || coll === 'dastavej') {
    Object.keys(D[coll]).forEach(k => { if (D[coll][k].id === o.id) delete D[coll][k]; });
  } else if (coll === 'ledger') {
    D.contractors.forEach(c => drop(c.ledger, o.id));

<script>

async function api(path, opts = {}) {
  let r;

  catch (e) { throw new Error('No internet connection, or the server could not be reached. Nothing was saved.'); }

  if (r.status === 401 && !opts.quiet) { showLogin(false, j.error); throw new Error(j.error || 'Please sign in again.'); }
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j;
}

    if (!f) return; btn.disabled = true; btn.textContent = 'Loading…';
    try { const records = JSON.parse(await f.text()); const r = await api('/api/import', {body: {records}}); btn.textContent = r.records + ' records loaded'; setTimeout(() => location.reload(), 800); }
    catch (err) { er.textContent = err.message.includes('JSON') ? 'This is not the Tatva data file.' : err.message; btn.disabled = false; btn.textContent = 'Load data'; }
  });
}
(async function boot() {
  try {
    const me = await api('/api/me', {quiet: true});
    if (!me.user) return showLogin(me.setup);
    const all = await api('/api/data');
    if (all.empty) return showImport(me.user);
    startApp(all.data, me.user, all);
  } catch (e) { const b = document.getElementById('bootMsg'); if (b) b.textContent = e.message; }
})();
</script>
